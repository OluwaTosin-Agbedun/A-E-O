document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>DCM map with period history<\u002Ftitle>\n<script src=\"279c1bd6-c559-4623-b589-afd403a47754\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"1280\"><meta name=\"hz:canvas-height\" content=\"1560\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Condensed:wght@500;600&amp;display=swap\">\n<style>\nbody{margin:0;background:#f3f4f6}\na{color:#1f5fa8}a:hover{color:#15457c}\nbutton:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #1f5fa8;outline-offset:2px}\n.dcm-path{cursor:pointer}\n.dcm-half:disabled{cursor:default}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; color: #1c232b; background: #f3f4f6; min-height: 100vh\" data-canvas-width=\"1280\" data-canvas-height=\"1560\" data-document-role=\"page\" data-label=\"DCM map with period history\">\n<div style=\"background: #1c232b; color: #ffffff; padding: 10px 24px; font-size: 14px; text-align: center\">Illustrative sample data for layout review only. The changes shown after the baseline are invented to demonstrate the design and are not AEO classifications.<\u002Fdiv>\n<div style=\"max-width: 1320px; margin: 0 auto; padding: 32px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px\">\n\n<header style=\"display: flex; flex-direction: column; gap: 8px\">\n<h1 style=\"margin: 0; font-size: 34px; line-height: 1.15; font-weight: 700\">Democratic Competitiveness Map<\u002Fh1>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #3d4752; max-width: 760px\">Evidence-based classifications of the practical conditions for political competition in the 36 states and the FCT, published twice a month. Use the panel to view any past map or follow one state through the year.<\u002Fp>\n<\u002Fheader>\n\n<section aria-label=\"What changed in this publication\" style=\"background: #ffffff; border: 1px solid #d5d9de; border-radius: 6px; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">What changed in this publication ({{summaryPeriod}})<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #1c232b; max-width: 1000px\">{{summaryText}}<\u002Fp>\n<\u002Fsection>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n\n<section aria-label=\"Map\" style=\"flex: 999 1 600px; min-width: 0; background: #ffffff; border: 1px solid #d5d9de; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-size: 20px; font-weight: 700\">{{mapHeading}}<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center\">\n<sc-for list=\"{{legend}}\" as=\"g\" hint-placeholder-count=\"5\">\n<span style=\"display: flex; align-items: center; gap: 8px; font-size: 14px\"><span aria-hidden=\"true\" style=\"width: 18px; height: 18px; border-radius: 3px; border: 1px solid #8a939c; background: {{g.hex}}; flex: none\"><\u002Fspan>{{g.name}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: #3d4752\">Insufficient evidence means AEO does not yet hold enough verified evidence to classify the state. It does not mean conditions are open.<\u002Fp>\n<svg sc-camel-view-box=\"0 0 760 617\" role=\"img\" aria-label=\"Map of Nigeria showing the classification of each state and the FCT for the selected publication\" style=\"width: 100%; height: auto; display: block\">\n<sc-for list=\"{{shapes}}\" as=\"s\" hint-placeholder-count=\"37\">\n<path class=\"dcm-path\" d=\"{{s.d}}\" sc-camel-on-click=\"{{s.pick}}\" style=\"fill: {{s.fill}}; fill-opacity: {{s.op}}; stroke: {{s.stroke}}; stroke-width: {{s.sw}}px; stroke-linejoin: round\"><title>{{s.title}}<\u002Ftitle><\u002Fpath>\n<\u002Fsc-for>\n<sc-for list=\"{{labels}}\" as=\"l\" hint-placeholder-count=\"37\">\n<text x=\"{{l.cx}}\" y=\"{{l.cy}}\" style=\"font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: {{l.fs}}px; fill: {{l.fill}}; opacity: {{l.op}}; text-anchor: middle; dominant-baseline: middle; pointer-events: none\">{{l.name}}<\u002Ftext>\n<\u002Fsc-for>\n<\u002Fsvg>\n<\u002Fsection>\n\n<aside aria-label=\"Map controls and state trend\" style=\"flex: 1 1 400px; min-width: 0; background: #ffffff; border: 1px solid #d5d9de; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 26px\">\n\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">View a published map<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<label for=\"dcm-year\" style=\"font-size: 14px; font-weight: 600\">Year<\u002Flabel>\n<sc-raw-select id=\"dcm-year\" value=\"{{yearVal}}\" sc-camel-on-change=\"{{onYear}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 8px; border: 1px solid #8a939c; border-radius: 4px; background: #ffffff; color: #1c232b; min-width: 0\">\n<sc-for list=\"{{yearOpts}}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{o.value}}\">{{o.label}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<label for=\"dcm-month\" style=\"font-size: 14px; font-weight: 600\">Month<\u002Flabel>\n<sc-raw-select id=\"dcm-month\" value=\"{{monthVal}}\" sc-camel-on-change=\"{{onMonth}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 8px; border: 1px solid #8a939c; border-radius: 4px; background: #ffffff; color: #1c232b; min-width: 0\">\n<sc-for list=\"{{monthOpts}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.value}}\">{{o.label}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<label for=\"dcm-period\" style=\"font-size: 14px; font-weight: 600\">Period<\u002Flabel>\n<sc-raw-select id=\"dcm-period\" value=\"{{periodVal}}\" sc-camel-on-change=\"{{onPeriod}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 8px; border: 1px solid #8a939c; border-radius: 4px; background: #ffffff; color: #1c232b; min-width: 0\">\n<sc-for list=\"{{periodOpts}}\" as=\"o\" hint-placeholder-count=\"2\"><option value=\"{{o.value}}\">{{o.label}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Follow a state<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"dcm-state\" style=\"font-size: 14px; font-weight: 600\">State or FCT<\u002Flabel>\n<sc-raw-select id=\"dcm-state\" value=\"{{selVal}}\" sc-camel-on-change=\"{{onState}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 8px; border: 1px solid #8a939c; border-radius: 4px; background: #ffffff; color: #1c232b\">\n<option value=\"\">All states<\u002Foption>\n<sc-for list=\"{{stateOpts}}\" as=\"o\" hint-placeholder-count=\"37\"><option value=\"{{o.name}}\">{{o.name}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<span style=\"font-size: 13px; color: #3d4752\">You can also click a state on the map.<\u002Fspan>\n<\u002Fdiv>\n\n<sc-if value=\"{{noState}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #3d4752\">Choose a state to see its classification trend for {{yearVal}}.<\u002Fp>\n<\u002Fsc-if>\n\n<sc-if value=\"{{hasState}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 700\">{{selName}}<\u002Fh3>\n<div style=\"display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600\"><span aria-hidden=\"true\" style=\"width: 20px; height: 20px; border-radius: 3px; border: 1px solid #8a939c; background: {{selHex}}; flex: none\"><\u002Fspan>{{selCat}}<span style=\"font-weight: 400; color: #3d4752\">({{periodShort}})<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: 15px; font-weight: 600\">{{yearVal}} trend<\u002Fspan>\n<div role=\"group\" aria-label=\"{{trendLabel}}\" style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); border-radius: 3px; overflow: hidden\">\n<sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\">\n<div style=\"display: flex; aspect-ratio: 1 / 1; border-right: {{m.sep}}\">\n<sc-for list=\"{{m.halves}}\" as=\"h\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"dcm-half\" sc-camel-on-click=\"{{h.pick}}\" disabled=\"{{h.off}}\" aria-label=\"{{h.aria}}\" title=\"{{h.aria}}\" style=\"flex: 1 1 0; min-width: 0; padding: 0; margin: 0; border: none; border-right: {{h.mid}}; background: {{h.hex}}; box-shadow: {{h.ring}}; cursor: pointer\"><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); font-size: 11px; color: #3d4752; text-align: center\">\n<sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\"><span>{{m.abbr}}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 13px; line-height: 1.5; color: #3d4752\">Each month is split in two: the left half is the publication for the 1st to the 15th, the right half the publication for the 16th to month-end. A pale cell means no publication.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{openForm}}\" style=\"font: inherit; font-size: 16px; font-weight: 600; min-height: 48px; padding: 10px 16px; border-radius: 4px; border: none; background: #1c232b; color: #ffffff; cursor: pointer; text-align: center\">Request the DCM Brief for this period<\u002Fbutton>\n<p style=\"margin: -12px 0 0; font-size: 14px; text-align: center; color: #3d4752\">Seen something we may have missed? <a href=\"#\" style=\"color: #1f5fa8; font-weight: 600\">Tell us<\u002Fa><\u002Fp>\n<\u002Faside>\n<\u002Fdiv>\n\n<sc-if value=\"{{formOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: fixed; inset: 0; background: rgba(28, 35, 43, 0.55); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; z-index: 50; box-sizing: border-box\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dcm-form-title\" style=\"background: #ffffff; border-radius: 6px; width: 100%; max-width: 580px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px\">\n\n<sc-if value=\"{{formEditing}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h2 id=\"dcm-form-title\" style=\"margin: 0; font-size: 24px; font-weight: 700\">Request the DCM Brief<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #3d4752\">Publication: {{periodShort}}. The brief covers all 36 states and the FCT and is free of charge.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"dcm-f-name\" style=\"font-size: 14px; font-weight: 600\">Full name<\u002Flabel>\n<input id=\"dcm-f-name\" type=\"text\" autocomplete=\"name\" value=\"{{fName}}\" sc-camel-on-change=\"{{onName}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 10px; border: 1px solid #8a939c; border-radius: 4px; box-sizing: border-box\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"dcm-f-email\" style=\"font-size: 14px; font-weight: 600\">Email address<\u002Flabel>\n<input id=\"dcm-f-email\" type=\"email\" autocomplete=\"email\" value=\"{{fEmail}}\" sc-camel-on-change=\"{{onEmail}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 10px; border: 1px solid #8a939c; border-radius: 4px; box-sizing: border-box\">\n<span style=\"font-size: 13px; color: #3d4752\">We will send the brief to this address.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"dcm-f-org\" style=\"font-size: 14px; font-weight: 600\">Organisation (optional)<\u002Flabel>\n<input id=\"dcm-f-org\" type=\"text\" autocomplete=\"organization\" value=\"{{fOrg}}\" sc-camel-on-change=\"{{onOrg}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 10px; border: 1px solid #8a939c; border-radius: 4px; box-sizing: border-box\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"dcm-f-sector\" style=\"font-size: 14px; font-weight: 600\">Which best describes you?<\u002Flabel>\n<sc-raw-select id=\"dcm-f-sector\" value=\"{{fSector}}\" sc-camel-on-change=\"{{onSector}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 6px 8px; border: 1px solid #8a939c; border-radius: 4px; background: #ffffff; color: #1c232b\">\n<option value=\"\">Select one<\u002Foption>\n<sc-for list=\"{{sectors}}\" as=\"o\" hint-placeholder-count=\"8\"><option value=\"{{o.value}}\">{{o.label}}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"dcm-f-use\" style=\"font-size: 14px; font-weight: 600\">How will you use the brief? (optional)<\u002Flabel>\n<textarea id=\"dcm-f-use\" rows=\"3\" value=\"{{fUse}}\" sc-camel-on-change=\"{{onUse}}\" style=\"font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid #8a939c; border-radius: 4px; box-sizing: border-box; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n\n<label style=\"display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5; cursor: pointer\"><input type=\"checkbox\" checked=\"{{fConsent}}\" sc-camel-on-change=\"{{onConsent}}\" style=\"width: 18px; height: 18px; margin: 2px 0 0; flex: none\">I agree that AEO may use these details to send me the brief, as set out in the [privacy notice].<\u002Flabel>\n\n<div style=\"display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{closeForm}}\" style=\"font: inherit; font-size: 15px; min-height: 44px; padding: 8px 18px; border-radius: 4px; border: 1px solid #8a939c; background: #ffffff; color: #1c232b; cursor: pointer\">Cancel<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{submitForm}}\" disabled=\"{{cantSubmit}}\" style=\"font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 8px 18px; border-radius: 4px; border: none; background: {{submitBg}}; color: #ffffff; cursor: pointer\">{{submitLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{formDone}}\" hint-placeholder-val=\"{{ false }}\">\n<h2 id=\"dcm-form-title\" style=\"margin: 0; font-size: 24px; font-weight: 700\">Request received<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5\">We will send the DCM Brief for the {{periodShort}} publication to {{fEmail}}.<\u002Fp>\n<div style=\"display: flex; justify-content: flex-end\">\n<button type=\"button\" sc-camel-on-click=\"{{closeForm}}\" style=\"font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 8px 18px; border-radius: 4px; border: none; background: #1c232b; color: #ffffff; cursor: pointer\">Close<\u002Fbut (\"fOrg\"), onSector: setF(\"fSector\"), onUse: setF(\"fUse\"), onOther: setF(\"fOther\"),\n      onConsent: function () { self.setState({ fConsent: !self.state.fConsent }); },\n      sectors: sectors, amounts: amounts, showOther: F.fAmount === \"other\",\n      donationAllowed: !blocked, donationBlocked: blocked, donating: donating, amtText: amtText,\n      cantSubmit: !canSubmit, submitBg: canSubmit ? \"#1c232b\" : \"#8a939c\",\n      submitLabel: donating ? \"Request the brief and donate \" + amtText : \"Request the brief\",\n      summaryPeriod: P.label.replace(/\\s*\\(.*\\)$/, \"\") === \"Baseline\" ? \"baseline, 1 July to 13 September 2026\" : P.short,\n      summaryText: (function () {\n        if (!prev) return \"This is the first published map. It sets the baseline classification for all 36 states and the FCT.\";\n        if (!changes.length) return \"No state changed classification in this publication.\";\n        var n = changes.length;\n        var parts = changes.map(function (c) {\n          return c.kind === \"First classification\"\n            ? c.name + \" received its first classification, \" + c.toCat + \", after [one-line reason from the decision record].\"\n            : c.name + \" moved from \" + c.fromCat + \" to \" + c.toCat + \" after [one-line reason from the decision record].\";\n        });\n        return (n === 1 ? \"One state\" : (n === 2 ? \"Two states\" : n + \" states\")) + \" moved in this publication. \" + parts.join(\" \") + \" All other states are unchanged.\";\n      })(),\n      mapHeading: \"Map as published for \" + P.short,\n      legend: DCM_ORDER.map(function (k) { return DCM_CAT[k]; }),\n      shapes: shapes, labels: labels,\n      showChanges: show,\n      toggleChanges: function () { self.setState({ showChanges: !self.state.showChanges }); },\n      yearVal: String(P.year),\n      yearOpts: years.map(function (y) { return { value: String(y), label: String(y) }; }),\n      onYear: function (e) { var y = Number(e.targe
